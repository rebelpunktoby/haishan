<!DOCTYPE html>

<style>
/* VOICE  quiet, spacious, nocturnal; a suite you can walk through, one movement at a time
   IDEA   four rooms of a folio: each movement gets its own page, the breath drawn as bars and beats
   PICTURE one breath per movement, large: barlines, a dot per beat, filled for in, ring for out
   COLOUR night ground, moon-white breath, jade hold and electronics, clay for the one accent
   TYPE   Fraunces light for numerals and names, Space Grotesk for the little that is said */
:root{color-scheme:light dark;
  --bg:light-dark(#f2f0ea,#0d0f11);--ink:light-dark(#16181b,#ece8df);--mute:light-dark(#62675f,#8e948e);
  --line:light-dark(#1b2626,#f1ecdf);--elec:light-dark(#4f8178,#7fb0a5);--acc:light-dark(#b0583e,#e5b49c);
  --rule:light-dark(#d9d5cb,#23272b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-snap-type:y proximity}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Space Grotesk",system-ui,sans-serif;overflow-x:clip}
.pg{min-height:100vh;padding:clamp(28px,5vw,72px) max(6vw,18px);max-width:1340px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;scroll-snap-align:start}

.back{color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:clamp(18px,3vh,28px);align-self:flex-start;min-height:44px;display:inline-flex;align-items:center}.back:hover{color:var(--ink)}
h1{font:300 clamp(40px,7vw,84px)/1 Fraunces,Georgia,serif;margin:0}h1 span{color:var(--mute);font-size:.5em;margin-left:.25em}
.sub{color:var(--mute);margin:14px 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(24px,4vh,40px)}
button,.chip{font:500 15px "Space Grotesk",sans-serif;min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--rule);
  background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
button:hover,.chip:hover{border-color:var(--mute)}button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:clamp(40px,8vh,90px)}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px 18px 18px;border-radius:4px;min-height:clamp(120px,20vh,190px);text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--elec) var(--a),transparent),transparent)}
.tile b{font:300 clamp(30px,4vw,48px)/1 Fraunces,serif}.tile span{font:300 19px/1.2 Fraunces,serif}.tile small{color:var(--mute);margin-top:auto}
.tile.open{background:none;border:1px dashed color-mix(in srgb,var(--elec) 70%,transparent)}
/* movement pages */
.mv{border-top:1px solid var(--rule)}
.mh{display:flex;align-items:baseline;gap:clamp(14px,2vw,28px);flex-wrap:wrap}
.num{font:300 clamp(64px,11vw,150px)/.9 Fraunces,serif;color:color-mix(in srgb,var(--elec) 75%,var(--ink))}
.nm{font:300 clamp(30px,4.4vw,54px)/1 Fraunces,serif}.nm span{color:var(--mute);font-size:.55em;margin-left:.3em}
.facts{display:flex;flex-wrap:wrap;gap:8px 34px;margin:clamp(20px,4vh,40px) 0 clamp(26px,5vh,54px);color:var(--mute)}
.facts b{display:block;font:300 clamp(24px,2.6vw,34px)/1.1 Fraunces,serif;color:var(--ink)}
.flow{display:flex;align-items:center;gap:clamp(10px,2vw,26px)}
.side{flex:none;width:clamp(56px,8vw,110px);display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--mute);font-size:12px}
.side .mini{width:100%;height:40px;border:1px dashed var(--rule);border-radius:3px;display:flex;align-items:center;justify-content:center;gap:4px}
.arrow{flex:none;color:var(--rule);font-size:22px}
.main{flex:1}
.bars{display:flex;gap:6px}
.bx{flex:1 1 0;display:flex;flex-direction:column;gap:8px}

.bx:first-child .dots{border-left-width:5px}
.d{display:inline-block;width:var(--ds,clamp(10px,1.3vw,18px));height:var(--ds,clamp(10px,1.3vw,18px));border-radius:50%;flex:none}
.d.in{background:var(--line)}.d.topup{background:var(--line);transform:scale(.7)}.d.hold{background:var(--elec)}

.rep{margin-top:14px;font:300 22px Fraunces,serif;color:var(--acc)}

  color:var(--mute);font-size:14px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--elec) 14%,transparent),transparent 60%)}
.intro{display:flex;align-items:center;gap:14px;margin-bottom:22px;color:var(--mute);font-size:13px}

.ses .nm{font-size:clamp(26px,3.4vw,40px)}
#slist{margin-top:clamp(18px,3vh,30px);display:grid;gap:0}
.srow{display:grid;grid-template-columns:120px 70px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
.srow:hover .st{color:var(--acc)}.srow small{color:var(--mute);font-size:13px}.srow .mvn{font:300 22px Fraunces,serif;color:var(--elec)}.srow .st{font:300 20px Fraunces,serif}
.sempty{color:var(--mute);padding:18px 0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}

/* perform: always night */
#pf{position:fixed;inset:0;z-index:9;background:#07080a;color:#ece8df;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(14px,3vw,32px)}
#pf[hidden]{display:none}
.pt{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:#8e948e}.pt b{color:#ece8df;font-weight:500}

.orb{width:40vmin;height:40vmin;border-radius:50%;background:radial-gradient(circle,rgba(241,236,223,.9) 0,rgba(241,236,223,.18) 46%,rgba(127,176,165,0) 70%);transform:scale(.5);will-change:transform}
#ph{font:300 clamp(16px,2.4vh,22px) Fraunces,serif;color:#8e948e;min-height:1.4em}
#ce{font:300 clamp(24px,4.6vh,46px)/1.15 Fraunces,serif;max-width:24ch;text-wrap:balance;min-height:2.3em;transition:opacity .8s}
#cz{font-size:clamp(17px,2.8vh,26px);color:#c9c4b9;min-height:1.5em;transition:opacity .8s}
.dim{opacity:.28}
.pb{display:grid;gap:12px}
.prog{display:flex;height:6px;gap:4px}.prog span{flex:1;background:#23272b;border-radius:3px}.prog span.on{background:#e5b49c}.prog span.done{background:#4d5a57}
.pc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#pf button{color:#ece8df;border-color:#2d3237}#pf button.on{border-color:#e5b49c;color:#e5b49c}
@media(max-width:700px){.idx{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{flex-direction:column;align-items:stretch}.side{width:auto;flex-direction:row}.side .mini{width:90px}.arrow{display:none}
  .dots{height:48px}.d{--ds:9px}}
@media(prefers-reduced-motion:reduce){#ce,#cz{transition:none}html{scroll-snap-type:none}}
</style>

<body>
<header class="pg" id="top">
  <a class="back" href="/#omt">山海 · OMT</a>
  <h1>Still Air <span>靜氣</span></h1>
  <p class="sub" data-en="four movements for piano, electronics and a breathing room" data-zh="為鋼琴、電子聲音與呼吸的房間而寫的四個樂章"></p>
  <div class="ctl"><button class="go" id="bSuite" data-en="Perform the suite" data-zh="演出全曲"></button><button id="bLang" aria-label="Switch language">中</button></div>
  <nav class="idx" id="idx" aria-label="Movements"></nav>
</header>
<main id="mvs"></main>
<section class="pg mv ses" id="sessions" aria-label="Sessions" style="min-height:auto">
  <div class="mh"><span class="nm" data-en="Sessions" data-zh="錄音與筆記"></span></div>
  <div id="slist"></div>
</section>
<footer class="pg" style="min-height:auto">
  <div class="key" id="key"></div>
  <p class="sub" data-en="Each movement breathes until it settles; the musician moves on. Holds are optional." data-zh="每個樂章呼吸到安定為止，由演奏者決定何時前進。屏息可選。"></p>
</footer>

<div id="pf" hidden>
  <div class="pt"><span id="psec"></span><span id="pcount"></span></div>
  <div class="stage"><div class="orb" id="orb"></div><div id="ph"></div><div id="ce"></div><div id="cz"></div></div>
  <div class="pb">
    <div class="prog" id="pbar"></div>
    <div class="pc">
      <button id="pPlay">Start</button><button id="pNext">Next ›</button><button id="pTone">Tone</button><button id="pExit">Exit</button>
    </div>
  </div>
</div>

<script>
{
const TLB = (function () {
var TXT = {
  pre:        ["No test here. If a breath feels wrong, breathe your own way.", "這不是測驗。哪一口氣不舒服，就用自己的方式。"],
  eyes:       ["Let your eyes close or rest low.", "讓眼睛關上，或輕輕垂下。"],
  already:    ["You're already breathing. Nothing to change.", "你已經在呼吸了，不用改變什麼。"],
  beside:     ["Let the sound sit beside your breath.", "讓聲音陪在你的呼吸旁邊。"],
  inSlow4:    ["In, slow...", "慢慢吸……"],
  outSlower6: ["Out, slower... longer than the in.", "更慢地吐……比吸氣更長。"],
  lowCount:   ["Let the low sound count for you now.", "現在讓低音替你數。"],
  musicCount: ["Let the music count for you now.", "現在讓音樂替你數。"],
  inSlow:     ["In, slow.", "慢慢吸。"],
  hum:        ["If you like, hum softly as you breathe out.", "如果你願意，吐氣時輕輕哼鳴。"],
  silent:     ["(silent from here)", "（從這裡開始靜默）"],
  boxIn:      ["Breathe in... two, three, four.", "吸氣……二、三、四。"],
  boxHold:    ["Hold, if that's easy... two, three, four.", "輕輕屏住，容易的話……二、三、四。"],
  boxOut:     ["Let it go... two, three, four.", "放掉……二、三、四。"],
  rest:       ["Rest.", "休息。"],
  tight:      ["Tight? Just breathe normally. That's fine.", "覺得緊？正常呼吸就好，沒關係。"],
  nobody:     ["Now nobody is counting. Breathe however you like.", "現在沒有人在數。想怎麼呼吸都可以。"],
  following:  ["(optional) The sound is following someone's breath.", "（可選）聲音正跟著某人的呼吸。"],
  sighIn:     ["Breathe in...", "吸氣……"],
  sighMore:   ["...and a little more.", "……再多一點。"],
  sighOut:    ["Long sigh out.", "長長吐一口氣。"],
  yours:      ["Breath is yours again. Wiggle your fingers.", "呼吸又是你自己的了。動一動手指。"],
  eyesOpen:   ["Open your eyes when you're ready.", "準備好了，就慢慢打開眼睛。"],
  gentleIn:   ["In, gently... four counts.", "溫柔地吸……四拍。"],
  gentleHold: ["Hold, only if it's comfortable.", "屏住，只在舒服的時候。"],
  longOut:    ["Long, slow out... let everything drop.", "長長地、慢慢地吐……全部放下。"],
  headLight:  ["Head light? Go back to your own breath.", "頭有點輕？回到自己的呼吸。"],
  settle:     ["Arrive. Breathe as you are.", "到了。照你現在的樣子呼吸。"],
  optout:     ["Dizzy or tight? Let the count go. Breathe your own way.", "頭暈或胸悶？不用再數。用自己的方式呼吸。"]
};

function cue(bars, beat, key) { return { bars: bars, beat: beat, key: key }; }
function ucue(at, key) { return { at: at, key: key }; }

// ---------------------------------------------------------------- pieces
function stillAirSections(entry) {
  return [
    { name: "Room", bpm: 72, meter: 4, bpb: 4, bars: 54, min: 27, max: 108, phases: [["free", 4]],
      cues: [cue(7, 1, "eyes"), cue(19, 1, "already"), cue(37, 1, "beside")] },
    { name: "Tide", bpm: 96, meter: 3, bpb: 15, bars: 32, min: 20, max: 48, phases: [["in", 6], ["out", 9]],
      cues: [cue([1, 2, 3], 1, "inSlow4"), cue([1, 2, 3], 7, "outSlower6"), cue(4, 1, "lowCount"),
             cue([5, 9, 13], 1, "inSlow"), cue(16, 1, "hum"), cue(17, 1, "silent")] },
    { name: "Square", bpm: 60, meter: 4, bpb: 16, bars: 15, min: 8, max: 24, phases: [["in", 4], ["hold", 4], ["out", 4], ["rest", 4]],
      cues: [cue("*", 1, "boxIn"), cue("*", 5, "boxHold"), cue("*", 9, "boxOut"), cue("*", 13, "rest"), cue(2, 13, "tight")] },
    entry
      ? { name: "Free piano", untimed: 180, min: 60, max: 600, cues: [ucue(0, "nobody")] }
      : { name: "Still Air", untimed: 360, min: 180, max: 900, cues: [ucue(0, "nobody"), ucue(180, "following")] },
    { name: "Sigh", bpm: 60, meter: 4, bpb: 8, bars: 6, min: 3, max: 9, phases: [["in", 2], ["top-up", 1], ["out", 5]],
      cues: [cue("*", 1, "sighIn"), cue("*", 3, "sighMore"), cue("*", 4, "sighOut")] },
    { name: "Coda", untimed: 72, min: 30, max: 180, cues: [ucue(0, "yours"), ucue(42, "eyesOpen")] }
  ];
}

// The suite: each movement alone gets a way in (4 bars of natural breath) and a way out (one sigh)
function settle(bpm, capture) {
  return { name: capture ? "Settle (capture)" : "Settle", auto: true, bpm: bpm, meter: 4, bpb: 4, bars: 4, phases: [["free", 4]], cues: [cue(1, 1, "settle")] };
}
function sighOut() {
  return { name: "Out", auto: true, bpm: 60, meter: 4, bpb: 8, bars: 1, phases: [["in", 2], ["top-up", 1], ["out", 5]],
           cues: [cue(1, 1, "sighIn"), cue(1, 3, "sighMore"), cue(1, 4, "sighOut")] };
}
function movement(n) {
  var all = stillAirSections(false);
  if (n === 1) return [all[0], all[1], sighOut()];
  if (n === 2) return [settle(60), all[2], sighOut()];
  if (n === 3) return [settle(60, true), all[3], sighOut()];
  return [settle(60), all[4], all[5]];
}

var PIECES = {
  stillair: { title: "Still Air", elec: "stillair", sections: stillAirSections(false) },
  m1: { title: "Still Air I. Tide", elec: "stillair", sections: movement(1) },
  m2: { title: "Still Air II. Square", elec: "stillair", sections: movement(2) },
  m3: { title: "Still Air III. Still Air", elec: "stillair", sections: movement(3) },
  m4: { title: "Still Air IV. Sigh", elec: "stillair", sections: movement(4) },
  entry:    { title: "Still Air - entry test (acoustic)", elec: "none", sections: stillAirSections(true) },
  breathclock: { title: "Breath Clock", elec: "breathclock", sections: [
    { name: "Arrival", bpm: 72, meter: 4, bpb: 4, bars: 54, phases: [["free", 4]],
      cues: [cue(7, 1, "eyes"), cue(19, 1, "already"), cue(37, 1, "beside")] },
    { name: "Box", bpm: 64, meter: 4, bpb: 16, bars: 16, phases: [["in", 4], ["hold", 4], ["out", 4], ["rest", 4]],
      cues: [cue("*", 1, "boxIn"), cue("*", 5, "boxHold"), cue("*", 9, "boxOut"), cue("*", 13, "rest"), cue(2, 13, "tight")] },
    { name: "Resonance", bpm: 90, meter: 3, bpb: 15, bars: 30, phases: [["in", 6], ["out", 9]],
      cues: [cue([1, 2, 3], 1, "inSlow4"), cue([1, 2, 3], 7, "outSlower6"), cue(4, 1, "musicCount"),
             cue([5, 9, 13], 1, "inSlow"), cue(16, 1, "hum"), cue(17, 1, "silent")] },
    { name: "4-7-8", bpm: 56, bpb: 19, bars: 10, phases: [["in", 4], ["hold", 7], ["out", 8]], restBars: [3, 6, 9, 10],
      cues: [cue([1, 2, 4, 5, 7, 8], 1, "gentleIn"), cue([1, 2, 4, 5, 7, 8], 5, "gentleHold"),
             cue([1, 2, 4, 5, 7, 8], 12, "longOut"), cue([3, 6, 9], 1, "headLight"), cue(10, 1, "silent")] },
    { name: "Dissolution", untimedUntil: 1110, cues: [ucue(0, "nobody")] },
    { name: "Return", bpm: 60, meter: 4, bpb: 8, bars: 3, phases: [["in", 2], ["top-up", 1], ["out", 5]],
      cues: [cue("*", 1, "sighIn"), cue("*", 3, "sighMore"), cue("*", 4, "sighOut")] },
    { name: "Coda", untimed: 66, cues: [ucue(0, "yours"), ucue(36, "eyesOpen")] }
  ] }
};

// ---------------------------------------------------------------- timeline
function barMatches(bars, bar) {
  if (bars === "*") return true;
  if (typeof bars === "number") return bars === bar;
  for (var i = 0; i < bars.length; i++) if (bars[i] === bar) return true;
  return false;
}

function phaseAt(sec, bar, beat) {
  // returns [name, isPhaseStart, phaseLengthBeats, beatIndexInPhase]
  if (sec.restBars && barMatches(sec.restBars, bar)) return ["rest (own breath)", beat === 1, sec.bpb, beat - 1];
  var b = beat;
  for (var i = 0; i < sec.phases.length; i++) {
    var len = sec.phases[i][1];
    if (b <= len) return [sec.phases[i][0], b === 1, len, b - 1];
    b -= len;
  }
  return ["?", false, 1, 0];
}

// click per beat: section start "bell", breath start "bar", barline or phase change "phase", else "beat"
function clickType(s, bar, beat) {
  if (bar === 1 && beat === 1) return "bell";
  if (beat === 1) return "bar";
  if (s.meter && (beat - 1) % s.meter === 0) return "phase";
  if (phaseAt(s, bar, beat)[1]) return "phase";
  return "beat";
}

// position in bars of the written meter: "bar:beat"
function barTag(s, bar, beat) {
  if (!s.meter) return bar + ":" + beat;
  var per = s.bpb / s.meter;
  return ((bar - 1) * per + Math.floor((beat - 1) / s.meter) + 1) + ":" + ((beat - 1) % s.meter + 1);
}

function buildTimeline(key) {
  var p = PIECES[key];
  var t = 0, i, j, s, out = { key: key, title: p.title, sections: [], cues: [], beats: [] };
  for (i = 0; i < p.sections.length; i++) {
    s = p.sections[i];
    var info = { idx: i, name: s.name, start: t, timed: !s.untimed && !s.untimedUntil, src: s };
    if (info.timed) {
      var beatSec = 60 / s.bpm;
      info.beatSec = beatSec;
      info.dur = s.bars * s.bpb * beatSec;
      for (var bar = 1; bar <= s.bars; bar++) {
        for (var beat = 1; beat <= s.bpb; beat++) {
          var bt = t + ((bar - 1) * s.bpb + (beat - 1)) * beatSec;
          var ph = phaseAt(s, bar, beat);
          var type = clickType(s, bar, beat);
          out.beats.push({ t: bt, type: type, sec: i, bar: bar, beat: beat, phase: ph[0] });
          var texts = [];
          for (j = 0; j < s.cues.length; j++) {
            var c = s.cues[j];
            if (c.beat === beat && barMatches(c.bars, bar)) texts.push(c.key);
          }
          if (texts.length) out.cues.push({ t: bt, sec: i, tag: (i + 1) + ":" + barTag(s, bar, beat), keys: texts });
        }
      }
    } else {
      info.dur = s.untimed ? s.untimed : (s.untimedUntil - t);
      for (j = 0; j < s.cues.length; j++) {
        out.cues.push({ t: t + s.cues[j].at, sec: i, tag: (i + 1) + ":+" + s.cues[j].at + "s", keys: [s.cues[j].key] });
      }
    }
    out.sections.push(info);
    t += info.dur;
  }
  out.total = t;
  return out;
}

function cueText(keys, lang) {
  var a = [];
  for (var i = 0; i < keys.length; i++) a.push(TXT[keys[i]][lang]);
  return a.join(" / ");
}

function fmt(sec) {
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec - m * 60;
  var ss = s.toFixed(1);
  if (s < 10) ss = "0" + ss;
  return m + ":" + ss;
}


  return { PIECES: PIECES, cueText: cueText, phaseAt: phaseAt, barMatches: barMatches, TXT: TXT };
})();
const $ = id => document.getElementById(id);
let lang = "en";
const PZ = { in: "吸", "top-up": "再吸", hold: "屏", out: "吐", rest: "歇", free: "自然" };
const MV = [
  { k: "m1", n: "I", main: "Tide", zh: "潮", rate: "6.4", alpha: "38%" },
  { k: "m2", n: "II", main: "Square", zh: "方", rate: "3.75", alpha: "60%" },
  { k: "m3", n: "III", main: "Still Air", zh: "靜氣", rate: "", alpha: "0%" },
  { k: "m4", n: "IV", main: "Sigh", zh: "嘆", rate: "7.5", alpha: "26%" }
];
const T = (en, zh) => `<span data-en="${en}" data-zh="${zh}"></span>`;
const secOf = (k, name) => TLB.PIECES[k].sections.find(s => s.name === name);

// one breath, as bars of the written meter with a dot per beat
function breathBars(src) {
  const m = src.meter, n = src.bpb / m; let html = "";
  for (let b = 0; b < n; b++) {
    let dots = ""; const first = TLB.phaseAt(src, 1, b * m + 1)[0], prev = b ? TLB.phaseAt(src, 1, b * m)[0] : null;
    for (let k = 1; k <= m; k++) dots += `<i class="d ${TLB.phaseAt(src, 1, b * m + k)[0].replace(/[^a-z]/g, "")}"></i>`;
    const lab = first === "free" || first === prev ? "" : first;
    html += `<div class="bx"><div class="dots">${dots}</div><span class="pl" data-en="${lab}" data-zh="${PZ[lab] || ""}"></span></div>`;
  }
  return `<div class="bars">${html}</div>`;
}
const settleMini = `<div class="side"><div class="mini">${"<i class='d free' style='--ds:7px'></i>".repeat(4)}</div>${T("settle", "安定")}</div>`;
const sighMini = `<div class="side"><div class="mini"><i class="d in" style="--ds:7px"></i><i class="d in" style="--ds:7px"></i><i class="d topup" style="--ds:7px"></i><i class="d out" style="--ds:7px"></i></div>${T("one sigh", "一次嘆息")}</div>`;
const arrow = `<span class="arrow">→</span>`;

function movementPage(m, i) {
  const secs = TLB.PIECES[m.k].sections, main = secs.find(s => s.name === m.main), src = main;
  let body, facts;
  if (main.untimed) {
    body = `<div class="field">${T("no clock · the body leads", "無時鐘 · 由身體引領")}</div>`;
    facts = `<div><b>${Math.round(src.min / 60)}–${Math.round(src.max / 60)}′</b>${T("open", "開放")}</div><div><b>A♭ B♭ C E♭ F</b>${T("pitches to draw from", "可用音")}</div>`;
  } else {
    body = breathBars(src) + `<div class="rep">× ${src.min}–${src.max}</div>`;
    facts = `<div><b>${src.meter}/4</b>♩ ${src.bpm}</div><div><b>${src.bpb / src.meter}</b>${T("bars per breath", "小節／每次呼吸")}</div><div><b>${m.rate}</b>${T("breaths / min", "每分鐘呼吸")}</div>`;
  }
  const first = secs[0], last = secs[secs.length - 1];
  const before = first.name === "Room"
    ? `<div class="intro">${T("opens with Room 室, natural breath", "以「室」開始，自然呼吸")}${breathBars(first)}<span>${first.min}–${first.max} ${lang === "zh" ? "" : ""}</span>${T("bars", "小節")}</div>` : "";
  const flow = `<div class="flow">${first.name.indexOf("Settle") === 0 ? settleMini + arrow : ""}<div class="main">${body}</div>${last.name === "Out" ? arrow + sighMini : last.name === "Coda" ? arrow + `<div class="side"><div class="mini">${T("coda", "尾聲")}</div>${T("open", "開放")}</div>` : ""}</div>`;
  return `<section class="pg mv" id="${m.k}" aria-label="${m.n} ${m.main}">
    <div class="mh"><span class="num">${m.n}</span><span class="nm">${m.main}<span>${m.zh}</span></span></div>
    <div class="facts">${facts}</div>${before}${flow}
    <div class="pact"><button data-play="${m.k}" data-en="Perform ${m.n}" data-zh="演出 ${m.n}"></button></div></section>`;
}
$("idx").innerHTML = MV.map(m => `<a class="tile${m.k === "m3" ? " open" : ""}" style="--a:${m.alpha}" href="#${m.k}"><b>${m.n}</b><span>${m.main} ${m.zh}</span><small>${m.rate ? m.rate + " /min" : "open"}</small></a>`).join("");
$("mvs").innerHTML = MV.map(movementPage).join("");
// Sessions: add one line per session after you play. url can be SoundCloud, Bandcamp, a video, or "".
// { date: "2026-12-02", mv: "I", title: "Tide, first room", place: "Coyoacán", url: "https://..." }
const SESSIONS = [];
$("slist").innerHTML = SESSIONS.length
  ? SESSIONS.map(x => `<a class="srow" href="${x.url || "#sessions"}"><small>${x.date}</small><span class="mvn">${x.mv}</span><span class="st">${x.title}</span><small>${x.place || ""}${x.url ? " ↗" : ""}</small></a>`).join("")
  : `<div class="sempty">${T("recordings and notes from the first sessions will appear here", "首批演出的錄音與筆記將在此發佈")}</div>`;
$("key").innerHTML = ["in", "hold", "out", "rest"].map(p => `<span><i class="d ${p}"></i>${T(p, PZ[p])}</span>`).join("");

function setLang(l) {
  lang = l; document.documentElement.lang = l === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-en]").forEach(e => e.textContent = e.dataset[l]);
  $("bLang").textContent = l === "en" ? "中" : "EN";
}
setLang("en");
$("bLang").onclick = () => setLang(lang === "en" ? "zh" : "en");

// ------------------------------------------------------------- perform: follows the breath, moves on with Next
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x)));
const P = { secs: null, i: 0, breath: 1, pos: 0, el: 0, playing: false, pending: false, last: 0, ac: null, tone: false, g: null, cue: null, cueAt: 0, beat: -1, raf: 0 };
function envOf(src, pos) {
  const beat = Math.floor(pos) + 1, ph = TLB.phaseAt(src, 1, beat), f = (ph[3] + pos - Math.floor(pos)) / ph[2];
  const sigh = src.phases.some(p => p[0] === "top-up");
  return { name: ph[0], v: ph[0] === "free" ? 0.45 + 0.25 * Math.sin(2 * Math.PI * P.el / 5) : ph[0] === "in" ? (sigh ? .8 : 1) * ease(f) : ph[0] === "top-up" ? .8 + .2 * ease(f) : ph[0] === "hold" ? 1 : ph[0] === "out" ? 1 - ease(f) : 0 };
}
function enter(i) {
  if (i >= P.secs.length) { P.playing = false; P.i = P.secs.length - 1; P.done = true; $("pPlay").textContent = "Start"; return; }
  P.i = i; P.breath = 1; P.pos = 0; P.el = 0; P.pending = false; P.beat = -1; P.uc = 0;
  $("pbar").innerHTML = P.secs.map((s, k) => `<span class="${k < i ? "done" : k === i ? "on" : ""}"></span>`).join("");
}
function showCue(keys) { P.cue = keys; P.cueAt = P.el; }
function step(dt) {
  const s = P.secs[P.i]; P.el += dt;
  if (s.untimed) {
    while (P.uc < s.cues.length && s.cues[P.uc].at <= P.el) showCue([s.cues[P.uc++].key]);
    if (P.pending || (s.max && P.el >= s.max)) enter(P.i + 1);
    return;
  }
  P.pos += dt * s.bpm / 60;
  if (P.pos >= s.bpb) {
    P.pos -= s.bpb; P.breath++; P.beat = -1;
    const cap = s.auto ? s.bars : s.max || 1e9;
    if (P.pending || P.breath > cap) { const carry = P.pos * 60 / s.bpm; enter(P.i + 1); if (!P.done) step(carry); return; }
  }
  const beat = Math.floor(P.pos) + 1;
  if (beat !== P.beat) {
    P.beat = beat; const k = [];
    for (const c of s.cues) if (c.beat === beat && TLB.barMatches(c.bars, P.breath)) k.push(c.key);
    if (k.length) showCue(k);
  }
}
function frame(now) {
  const dt = Math.min(0.1, (now - P.last) / 1000); P.last = now;
  if (P.playing) step(dt);
  const s = P.secs[P.i];
  let e = s.untimed ? { name: "free", v: 0.35 + 0.08 * Math.sin(2 * Math.PI * 0.1 * P.el) } : envOf(s, P.pos);
  $("orb").style.transform = "scale(" + (0.42 + 0.58 * e.v).toFixed(3) + ")";
  const key = e.name.indexOf("rest") === 0 ? "rest" : e.name;
  $("ph").textContent = P.done ? "· 完 ·" : (key === "free" ? "" : key + "  ·  " + (PZ[key] || ""));
  $("psec").textContent = P.title + "  ·  " + s.name.replace(" (capture)", "");
  $("pcount").textContent = P.pending ? (lang === "zh" ? "呼吸結束後前進" : "next at the breath end") :
    s.untimed ? "" : (s.phases[0][0] === "free" ? "" : (lang === "zh" ? "第 " + P.breath + " 次呼吸" : "breath " + P.breath) + (s.min && !s.auto ? (P.breath >= s.min ? "  ·  ready" : "") : ""));
  if (P.cue) { $("ce").textContent = TLB.cueText(P.cue, 0); $("cz").textContent = TLB.cueText(P.cue, 1); $("ce").className = $("cz").className = (P.el - P.cueAt > 9 || P.el < P.cueAt ? "dim" : ""); }
  if (P.g) P.g.gain.setTargetAtTime(P.tone && P.playing && !s.untimed && e.name !== "free" ? 0.12 * e.v : 0, P.ac.currentTime, 0.05);
  P.raf = requestAnimationFrame(frame);
}
async function openPerform(k) {
  const pc = TLB.PIECES[k]; P.secs = pc.sections; P.title = pc.title.replace("Still Air ", "");
  P.done = false; P.playing = false; P.cue = ["pre"]; P.cueAt = 0; enter(0);
  $("pPlay").textContent = "Start"; $("pf").hidden = false;
  try {
    if (!P.ac) {
      P.ac = new AudioContext(); P.g = P.ac.createGain(); P.g.gain.value = 0; P.g.connect(P.ac.destination);
      [220, 330].forEach((f, j) => { const o = P.ac.createOscillator(), v = P.ac.createGain(); o.frequency.value = f; v.gain.value = j ? .5 : 1; o.connect(v).connect(P.g); o.start(); });
    }
    await P.ac.resume();
  } catch (e) { P.ac = null; P.g = null; }
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { P.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  cancelAnimationFrame(P.raf); P.last = performance.now(); P.raf = requestAnimationFrame(frame);
}
function closePerform() {
  P.playing = false; $("pf").hidden = true; cancelAnimationFrame(P.raf); if (P.g) P.g.gain.value = 0;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  try { P.lock && P.lock.release(); } catch (e) {}
}
function play() {
  if (P.done) { P.done = false; enter(0); }
  P.playing = !P.playing; $("pPlay").textContent = P.playing ? "Pause" : "Resume";
}
function next() { if (P.playing) P.pending = true; }
$("bSuite").onclick = () => openPerform("stillair");
document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => openPerform(b.dataset.play));
$("pPlay").onclick = play; $("pNext").onclick = next; $("pExit").onclick = closePerform;
$("pTone").onclick = () => { P.tone = !P.tone && !!P.g; $("pTone").classList.toggle("on", P.tone); };
document.addEventListener("keydown", e => {
  if ($("pf").hidden) return;
  if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "ArrowRight" || e.key === "n" || e.key === "N") next();
  else if (e.key === "t" || e.key === "T") $("pTone").onclick();
  else if (e.key === "Escape") closePerform();
});
}
</script>
</body>
</html>
